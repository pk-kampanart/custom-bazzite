# Adapted from ublue-os/bazzite-dx .github/workflows/build.yml (cosign signing removed).
name: Build custom-bazzite
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

env:
  IMAGE_DESC: "${{ github.event.repository.description }}"

  # The tag used in the image from which we base of.
  # ex.: ghcr.io/org/image:IMAGE_SOURCE_TAG
  IMAGE_SOURCE_TAG: "stable"
  SOURCE_ORG: "ublue-os"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_push:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bazzite-custom
            base: bazzite-deck
          - image: bazzite-custom-nvidia
            base: bazzite-nvidia

    env:
      IMAGE_NAME: ${{ matrix.image }}
      BASE_NAME: ${{ matrix.base }}

    permissions:
      contents: read
      packages: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # OUTPUTS:
      #   - digest: manifest digest of the base image at IMAGE_SOURCE_TAG
      #   - owner_lc: lowercase repository owner
      #   - skip: "true" on scheduled runs when the published image was built from this digest
      - name: Check base image digest
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner_lc="${OWNER,,}"
          echo "owner_lc=${owner_lc}" >> "$GITHUB_OUTPUT"

          digest=$(skopeo inspect --format '{{.Digest}}' \
            "docker://ghcr.io/${SOURCE_ORG}/${BASE_NAME}:${IMAGE_SOURCE_TAG}")
          if [[ -z $digest ]]; then
            echo "::error::Could not resolve digest of ghcr.io/${SOURCE_ORG}/${BASE_NAME}:${IMAGE_SOURCE_TAG}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          skip=false
          if [[ $EVENT_NAME == schedule ]]; then
            # Missing image, missing label or any registry error => empty => build.
            published=$(
              skopeo inspect --raw --config \
                "docker://ghcr.io/${owner_lc}/${IMAGE_NAME}:${IMAGE_SOURCE_TAG}" 2>/dev/null | \
                jq -r '.config.Labels["io.github.pk-kampanart.base-digest"] // empty' 2>/dev/null
            ) || published=""
            if [[ -n $published && $published == "$digest" ]]; then
              skip=true
              echo "Base ${BASE_NAME}@${digest} unchanged since last ${IMAGE_NAME} build; skipping." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Show disk space
        if: steps.base.outputs.skip != 'true'
        run: sudo df -h

      - name: Check if /mnt is there
        id: check_mnt
        if: steps.base.outputs.skip != 'true'
        run: |
          if sudo mountpoint /mnt; then
            echo "mnt_is_there=1" >>$GITHUB_OUTPUT
          else
            echo "mnt_is_there=0" >>$GITHUB_OUTPUT
          fi

      - name: Free Disk Space (Ubuntu)
        if: ${{ steps.base.outputs.skip != 'true' && steps.check_mnt.outputs.mnt_is_there == '1' }}
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main
        if: ${{ steps.base.outputs.skip != 'true' && steps.check_mnt.outputs.mnt_is_there == '1' }}

      # OUTPUTS:
      #   - SOURCE_VERSION: version of the source image. Ex.: testing-41.20250312
      #   - SOURCE_VERSION_MAJOR: major version. Used to identify big releases. Ex.: 41
      - name: Get image major version
        id: fetch_source_meta
        if: steps.base.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -x
          # SOURCE_VERSION_MAJOR must be a number
          declare -i SOURCE_VERSION_MAJOR=0

          # Read the version label from the exact base digest that is built on.
          SOURCE_VERSION=$(
                skopeo inspect --no-tags --raw --config \
                "docker://ghcr.io/${SOURCE_ORG}/${BASE_NAME}@${DIGEST}" | \
                jq -r '.config.Labels["org.opencontainers.image.version"]'
          )
          if [[ -z $SOURCE_VERSION ]]; then
            echo "::error::SOURCE_VERSION was not fetched correctly: SOURCE_VERSION=${SOURCE_VERSION}"
            exit 1
          fi
          echo "SOURCE_VERSION=$SOURCE_VERSION" >>$GITHUB_OUTPUT

          SOURCE_VERSION_MAJOR=$([[ ${SOURCE_VERSION} =~ ^(.*-)?([[:digit:]]+) ]] && echo "${BASH_REMATCH[-1]}")
          _status=$?

          if [[ $_status -ne 0 ]] || [[ -z ${SOURCE_VERSION_MAJOR} ]] || (( SOURCE_VERSION_MAJOR <= 0 )); then
            echo "::error::SOURCE_VERSION_MAJOR was not fetched correctly: SOURCE_VERSION_MAJOR=${SOURCE_VERSION_MAJOR}"
            exit 1
          fi

          echo "SOURCE_VERSION_MAJOR=$SOURCE_VERSION_MAJOR" >>$GITHUB_OUTPUT

      # Generate a file with all the build-args passed to buildah
      - name: Prepare build args file
        if: steps.base.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.base.outputs.digest }}
          OWNER_LC: ${{ steps.base.outputs.owner_lc }}
        run: |
          cat <<EOF >>build_args.txt
          BASE_IMAGE=ghcr.io/${SOURCE_ORG}/${BASE_NAME}@${DIGEST}
          IMAGE_NAME=${IMAGE_NAME}
          IMAGE_VENDOR=${OWNER_LC}
          EOF

      # Build image using buildah and save it to raw-img
      - name: Build Image
        id: build_image
        if: steps.base.outputs.skip != 'true'
        run: |
          sudo -E buildah build \
            --build-arg-file build_args.txt \
            --tag raw-img .

      - name: Apply Labels
        id: relabel
        if: steps.base.outputs.skip != 'true'
        env:
          IMAGE_LABELS: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/README.md
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/main/Containerfile
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=bootc,ublue,universal-blue
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.prerelease=false
            io.github.pk-kampanart.base-digest=${{ steps.base.outputs.digest }}
            containers.bootc=1
          SOURCE_VERSION_MAJOR: ${{ steps.fetch_source_meta.outputs.SOURCE_VERSION_MAJOR }}
        run: |
          version="${SOURCE_VERSION_MAJOR}.$(date -u +%Y%m%d)"

          # Figure out config
          mapfile -t labels <<< "$IMAGE_LABELS"
          labels+=(
            "org.opencontainers.image.version=$version"
            "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          )

          # Apply config to labels and annotations
          container=$(sudo buildah from raw-img)
          for line in "${labels[@]}"; do
            [ -z "$line" ] && continue
            sudo buildah config --label "$line" --annotation "$line" "$container"
          done
          sudo buildah commit --identity-label=false --rm $container raw-img

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Reprocess raw-img using rechunker which will delete it
      - name: Run Rechunker
        id: rechunk
        if: steps.base.outputs.skip != 'true'
        run: |
          container=$(sudo buildah from raw-img)
          mnt=$(sudo buildah mount $container)
          sudo bash -c "rm -rf $mnt/run/.* $mnt/run/* $mnt/tmp/.* $mnt/tmp/*"
          sudo buildah umount $container
          sudo buildah commit --identity-label=false --rm $container raw-img

          sudo podman run --rm --privileged --volume /var/lib/containers:/var/lib/containers \
              localhost/raw-img \
              rpm-ostree compose build-chunked-oci \
              --bootc --max-layers 127 --format-version 2 \
              --from localhost/raw-img --output containers-storage:localhost/chunked-img
          sudo podman untag raw-img

          echo "ref=containers-storage:localhost/chunked-img" >> "$GITHUB_OUTPUT"

      # Generate tags after relabel runs
      # OUTPUTS:
      #   - version_tag: primary tag pushed first, ex.: stable-42.20250312
      #   - alias_tags: tags copied off the pushed digest, ex.: stable 42
      - name: Generate tags
        id: generate-tags
        if: steps.base.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.relabel.outputs.version }}
          SOURCE_VERSION_MAJOR: ${{ steps.fetch_source_meta.outputs.SOURCE_VERSION_MAJOR }}
        run: |
          VERSION_TAG="${IMAGE_SOURCE_TAG}-${VERSION}"
          ALIAS_TAGS=("${IMAGE_SOURCE_TAG}" "${SOURCE_VERSION_MAJOR}")

          echo "Generated the following build tags: "
          for TAG in "${VERSION_TAG}" "${ALIAS_TAGS[@]}"; do
              echo "${TAG}"
          done
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "alias_tags=${ALIAS_TAGS[*]}" >> $GITHUB_OUTPUT

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      - name: Login to GitHub Container Registry
        if: steps.base.outputs.skip != 'true' && github.event_name != 'pull_request'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Workaround bug where capital letters in your GitHub username make it impossible to push to GHCR.
      # https://github.com/macbre/push-to-ghcr/issues/12
      - name: Lowercase Image and Registry
        id: lowercase
        if: steps.base.outputs.skip != 'true'
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -x
          echo "registry=${IMAGE_REGISTRY,,}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      # Push the image to GHCR (Image Registry)
      - name: Push to GHCR
        id: push
        if: steps.base.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          ALIAS_TAGS: ${{ steps.generate-tags.outputs.alias_tags }}
          OUTPUT_IMAGE: ${{ steps.lowercase.outputs.registry }}/${{ steps.lowercase.outputs.image }}
          RECHUNK_REF: ${{ steps.rechunk.outputs.ref }}
          VERSION_TAG: ${{ steps.generate-tags.outputs.version_tag }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: |
            set -euo pipefail

            log_sum() { echo "$1" >> $GITHUB_STEP_SUMMARY; }
            log_sum '# Push to GHCR result'
            log_sum '```'

            push_version() {
              sudo podman push --digestfile=/tmp/digestfile \
                "${RECHUNK_REF#containers-storage:}" "docker://${OUTPUT_IMAGE}:${VERSION_TAG}"
            }
            push_version
            push_version
            log_sum "${OUTPUT_IMAGE}:${VERSION_TAG}"

            digest="$(sudo cat /tmp/digestfile)"
            if [[ -z "$digest" ]]; then
              echo "push reported success but wrote no digest" >&2
              exit 1
            fi

            # Tag every alias off the pushed digest so all tags resolve
            # to the exact same manifest.
            for tag in ${ALIAS_TAGS}; do
              sudo skopeo copy "docker://${OUTPUT_IMAGE}@${digest}" "docker://${OUTPUT_IMAGE}:$tag"
              log_sum "${OUTPUT_IMAGE}:$tag"
            done
            log_sum '```'

            echo "digest=${digest}" >> $GITHUB_OUTPUT

  check:
    name: Check all builds successful
    if: always()
    runs-on: ubuntu-latest
    needs: [build_push]
    steps:
      - name: Check Jobs
        env:
          JOBS: ${{ toJson(needs) }}
        run: |
          echo "Job status:"
          echo $JOBS | jq -r 'to_entries[] | " - \(.key): \(.value.result)"'

          for i in $(echo $JOBS | jq -r 'to_entries[] | .value.result'); do
            if [ "$i" != "success" ] && [ "$i" != "skipped" ]; then
              echo ""
              echo "Status check not okay!"
              exit 1
            fi
          done
